<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Travel Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MapLibre CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
    }

    /* Page padding creates inset from viewport edges */
    .page {
      display: flex;
      height: 100vh;
      width: 100%;
      padding: 16px;           /* ← top & left margin (and right/bottom) */
      box-sizing: border-box;
      gap: 16px;               /* space between map and content */
    }

    /* Map takes ~65% of available inner width */
    .map-container {
      flex: 0 0 65%;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 16px;     /* optional but visually clean */
      overflow: hidden;
    }

    /* Placeholder for future content */
    .content {
      flex: 1;
      padding: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="map-container">
      <div id="map" aria-label="Interactive travel map"></div>
    </div>

    <div class="content">
      <!-- Future content goes here -->
    </div>
  </div>

  <!-- MapLibre JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Base map bootstrap -->
  <script src="./map.js"></script>

</body>
</html>
